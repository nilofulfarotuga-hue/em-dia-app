# Ficha da App Store do Em Dia - missao emdia-redes-2026-09-28, E0.
# De 6 em 6 horas: quando a Apple aprovar a versao, troca o Texto promocional;
# quando houver versao nova em preparacao, tira da Descricao a frase
# "Quando as assinaturas abrirem...". Idempotente: depois de feito, so le e diz "ja estava".
# Nao compila nada e nao submete nada.

name: ios-ficha

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "ler = so mostrar o estado, sem escrever"
        type: choice
        options: [escrever, ler]
        default: ler

jobs:
  ficha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e acertar a ficha
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || 'escrever' }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyjwt cryptography requests
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_B64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          export ASC_P8=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          python3 .github/scripts/ios_ficha.py | tee -a "$GITHUB_STEP_SUMMARY"
