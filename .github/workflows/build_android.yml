name: Build Android & Play (internal + alpha)

# Copiado do Bora (bora-app-cloud/build_android.yml) com DUAS diferenças de propósito:
#  1. Tracks: SÓ `internal,alpha`. Produção só depois de aprovado — nunca automático.
#  2. Passos que dependem de coisas ainda por configurar (Firebase, service account da Play)
#     são condicionais: sem o secret, o build continua e o AAB fica como artifact.
# versionCode: incrementado AQUI, nunca à mão no pubspec.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "docs/**"
      - "tool/vigia/**"
      - "site/**"
      - "supabase/**"
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commit/push do bump do versionCode

jobs:
  build:
    name: Build AAB & upload (internal + alpha)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Mesma versão do PC (3.47.2). O .dart_defines NÃO tem linhas de comentário —
      # foi um '#' nesse ficheiro que partiu o login do Bora com um Flutter mais novo.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # NDK pinado (evita download de ~1,5 GB a meio do bundleRelease)
      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"

      - name: Verificar secrets opcionais
        id: opc
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "firebase=sim" >> "$GITHUB_OUTPUT"; else echo "firebase=nao" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$PLAY" ]; then echo "play=sim" >> "$GITHUB_OUTPUT"; else echo "play=nao" >> "$GITHUB_OUTPUT"; fi

      - name: Decode google-services.json (Firebase)
        if: steps.opc.outputs.firebase == 'sim'
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          echo "OK: google-services.json ($(wc -c < android/app/google-services.json) bytes)"

      - name: Aviso Firebase em falta
        if: steps.opc.outputs.firebase == 'nao'
        run: echo "::warning::GOOGLE_SERVICES_JSON_B64 ausente — build sem Firebase (avisos push desligados nesta build)."

      - name: Decode .dart_defines
        env:
          DART_DEFINES_FILE_B64: ${{ secrets.DART_DEFINES_FILE_B64 }}
        run: |
          echo "$DART_DEFINES_FILE_B64" | base64 --decode > .dart_defines
          if [ ! -s .dart_defines ]; then
            echo "ERRO: .dart_defines vazio apos decode"; exit 1
          fi
          echo "OK: .dart_defines criado ($(wc -l < .dart_defines) linhas)"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "OK: keystore ($(wc -c < android/app/upload-keystore.jks) bytes)"

      - name: Create key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      # Lê a versão do HEAD remoto (não do SHA desta run) — evita colisão de versionCode
      # quando dois pushes seguidos enfileiram duas runs (cicatriz do Bora, 2026-07-13).
      - name: Bump versionCode
        id: bump
        run: |
          git fetch origin main
          git checkout origin/main -- pubspec.yaml
          current=$(grep -E '^version:' pubspec.yaml | head -n1 | sed 's/version:[[:space:]]*//')
          name="${current%+*}"
          code="${current#*+}"
          new_code=$((code + 1))
          sed -i "s/^version:.*/version: ${name}+${new_code}/" pubspec.yaml
          echo "Old: ${current}  ->  New: ${name}+${new_code}"
          echo "new_code=${new_code}" >> "$GITHUB_OUTPUT"
          echo "version_name=${name}" >> "$GITHUB_OUTPUT"

      - name: Commit versionCode bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add pubspec.yaml
          git commit -m "ci: bump versionCode to ${{ steps.bump.outputs.new_code }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (0 erros)
        run: flutter analyze --no-fatal-infos

      - name: Testes unitários das regras
        run: flutter test test/unit -r expanded

      - name: Build appbundle (release)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: flutter build appbundle --release --dart-define-from-file=.dart_defines --dart-define=EMDIA_VERSION_CODE=${{ steps.bump.outputs.new_code }} --no-tree-shake-icons

      - name: Guardar AAB como artifact
        uses: actions/upload-artifact@v4
        with:
          name: em-dia-${{ steps.bump.outputs.version_name }}+${{ steps.bump.outputs.new_code }}.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # SÓ internal + alpha. Produção é decisão humana depois da aprovação da Google.
      # status: completed (draft ficaria parado à espera de um clique).
      - name: Upload to Google Play (internal + alpha)
        if: steps.opc.outputs.play == 'sim'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pt.emdia.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal,alpha
          status: completed

      - name: Aviso Play em falta
        if: steps.opc.outputs.play == 'nao'
        run: echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON ausente — o AAB ficou como artifact; sem upload para a Play."
