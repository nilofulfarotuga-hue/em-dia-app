name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    # O contexto `secrets` NÃO existe no `if:` de um passo (o GitHub recusa o ficheiro todo,
    # startup_failure sem job nenhum). Passam por aqui, porque `env` é conhecido no `if:`.
    env:
      IOS_CERTIFICATE_P12_B64: ${{ secrets.IOS_CERTIFICATE_P12_B64 }}
      IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Dart defines
        shell: bash
        env:
          DART_DEFINES_FILE_B64: ${{ secrets.DART_DEFINES_FILE_B64 }}
        run: |
          if [ -n "$DART_DEFINES_FILE_B64" ]; then
            echo "$DART_DEFINES_FILE_B64" | base64 --decode > .dart_defines
          else
            printf 'SUPABASE_URL=\nSUPABASE_ANON_KEY=\nTURNSTILE_SITE_KEY=\nEMAIL_REVISOR=\nGOOGLE_WEB_CLIENT_ID=\n' > .dart_defines
            echo "::warning::DART_DEFINES_FILE_B64 ausente; build pode arrancar sem serviços externos."
          fi

      - name: Restore iOS Firebase file if present
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_B64 ausente; push iOS fica desligado nesta build."
          fi

      - name: Mirror public/native values into xcconfig
        shell: bash
        run: |
          awk -F= '/^(TURNSTILE_SITE_KEY|SUPABASE_URL|GOOGLE_WEB_CLIENT_ID|EMAIL_REVISOR)=/ { print $1 "=" $2 }' .dart_defines > ios/Flutter/Secrets.xcconfig

      - name: Install pods
        run: |
          cd ios
          pod install

      - name: Import signing certificate
        if: ${{ env.IOS_CERTIFICATE_P12_B64 != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_B64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Restore provisioning profile
        if: ${{ env.IOS_PROVISIONING_PROFILE_B64 != '' }}
        shell: bash
        env:
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/em-dia.mobileprovision"

      - name: Restore export options
        shell: bash
        env:
          IOS_EXPORT_OPTIONS_PLIST_B64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_B64 }}
        run: |
          if [ -n "$IOS_EXPORT_OPTIONS_PLIST_B64" ]; then
            echo "$IOS_EXPORT_OPTIONS_PLIST_B64" | base64 --decode > ios/ExportOptions.plist
          else
            cat > ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store</string><key>signingStyle</key><string>automatic</string></dict></plist>
          PLIST
          fi

      - name: Build IPA
        run: flutter build ipa --release --dart-define-from-file=.dart_defines --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: em-dia-ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        if: ${{ env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_KEY_ID != '' && env.APPSTORE_PRIVATE_KEY != '' }}
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
