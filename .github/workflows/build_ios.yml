# Build iOS do Em Dia — missão em-dia-ios-2026-09-22 (receita copiada do Bora,
# nilofulfarotuga-hue/bora-app-cloud, .github/workflows/build_ios.yml, e
# adaptada: bundle com.boraguarda.emdia, App Store Connect apple_id 6814807320).
#
# Dois jobs:
#
#   • JOB A "simulador" — NÃO precisa de conta Apple. Análise, testes, compila
#     para o simulador e tira as capturas da App Store nos dois tamanhos que a
#     Apple pede (6,9" e 6,5"). Sai como artefacto `ios-capturas-N`.
#
#   • JOB B "release" — IPA assinado → App Store Connect (altool) → versão
#     seguinte com lançamento AFTER_APPROVAL → build ligada → notas → submetida
#     (.github/scripts/ios_publicar.py). Só corre à mão, com `enviar=true`, e só
#     se o job A passou. Os segredos estão em docs/SECRETS-IOS.md.
#
# Só `workflow_dispatch`: um push para main NÃO dispara o iOS (a web e o Android
# têm os seus workflows; o iPhone publica-se por ordem, não por acidente).
#
# versionCode: o do Android é do build_android.yml e NÃO se toca. O iOS usa
# `github.run_number` como CFBundleVersion — contadores independentes.

name: build-ios

on:
  workflow_dispatch:
    inputs:
      enviar:
        description: "Correr o job de release e enviar para o App Store Connect (precisa dos segredos de assinatura)"
        type: boolean
        default: false
      # Ligado (o normal), depois do upload o CI cria/reaproveita a versão com
      # lançamento AUTOMÁTICO após aprovação, liga a build, escreve as notas e
      # submete. Desligado, o IPA sobe só para o TestFlight.
      submeter_revisao:
        description: "Depois do upload, preparar a versão (lançamento automático) e submeter para revisão"
        type: boolean
        default: true

env:
  # Mesma versão que os outros workflows do repo (build_android, build_web_deploy, olho_golden).
  FLUTTER_VERSION: "3.47.2"
  # latest-stable numa imagem macos-26 dá um Xcode 26, que é o que a Apple exige.
  # Cravar "26.0" partiu o Bora (corrida 34162271844: destino "ineligible").
  XCODE_VERSION: "latest-stable"
  BUNDLE_ID: "com.boraguarda.emdia"
  ASC_APP_ID: "6814807320"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  simulador:
    name: A · Testes, simulador e capturas (sem conta Apple)
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Fixar Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Versões do que está instalado (prova)
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Segredos de build (dart-defines + xcconfig)
        env:
          DART_DEFINES_FILE_B64: ${{ secrets.DART_DEFINES_FILE_B64 }}
        run: |
          if [ -n "$DART_DEFINES_FILE_B64" ]; then
            echo "$DART_DEFINES_FILE_B64" | base64 --decode > .dart_defines
            echo "dart-defines injetados ($(wc -l < .dart_defines) linhas)"
          else
            # As capturas usam o modo exemplo (sem servidor): o job corre sem o segredo.
            printf 'SUPABASE_URL=\nSUPABASE_ANON_KEY=\nTURNSTILE_SITE_KEY=\nEMAIL_REVISOR=\nGOOGLE_WEB_CLIENT_ID=\n' > .dart_defines
            echo "::warning::DART_DEFINES_FILE_B64 ausente — a compilar sem chaves."
          fi
          # Valores públicos/nativos que o Xcode precisa (Debug/Release.xcconfig incluem este ficheiro).
          awk -F= '/^(TURNSTILE_SITE_KEY|SUPABASE_URL|GOOGLE_WEB_CLIENT_ID|EMAIL_REVISOR)=/ { print $1 "=" $2 }' .dart_defines > ios/Flutter/Secrets.xcconfig

      - name: GoogleService-Info.plist (Firebase iOS, opcional)
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist colocado."
          else
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_B64 ausente — push iOS desligado nesta build."
          fi

      - name: Dependências
        run: flutter pub get

      - name: Cache dos pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile') }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      # Os goldens NÃO correm aqui: as fotos de referência são desenhadas no
      # Linux (olho_golden.yml) e o macOS desenha as letras de outra maneira.
      - name: Testes (regras + percurso por todos os ecrãs)
        run: |
          flutter test test/unit -r compact
          flutter test test/integracao -r compact

      # Capturas da App Store: a Apple pede 6,9" (1320×2868) e 6,5" (1284×2778
      # ou 1242×2688). Não se crava um nome de simulador que a imagem do runner
      # não tenha: CRIA-SE um aparelho novo a partir do TIPO, no runtime iOS mais
      # recente, e escolhe-se o primeiro tipo da lista que existir nesta imagem.
      - name: Capturas 6,9" e 6,5" no simulador (modo exemplo)
        id: capturas
        timeout-minutes: 60
        run: |
          set -uo pipefail
          mkdir -p artefactos/capturas
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json;r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']];print(sorted(r,key=lambda x:[int(p) for p in x['version'].split('.')])[-1]['identifier'])")
          echo "runtime: $RUNTIME"
          TIPOS=$(xcrun simctl list devicetypes -j)
          escolhe() {  # imprime o primeiro identificador de tipo que existir
            for n in "$@"; do
              echo "$TIPOS" | python3 -c "import sys,json;t=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if x['name']==sys.argv[1]];print(t[0] if t else '')" "$n" | grep . && return 0
            done
            return 1
          }
          falhou=0
          for alvo in "6.9|iPhone 17 Pro Max|iPhone 16 Pro Max|iPhone 16 Plus|iPhone 15 Pro Max" \
                      "6.5|iPhone 14 Plus|iPhone 13 Pro Max|iPhone 12 Pro Max|iPhone 11 Pro Max"; do
            IFS='|' read -r TAM T1 T2 T3 T4 <<< "$alvo"
            TIPO=$(escolhe "$T1" "$T2" "$T3" "$T4") || { echo "::error::nenhum simulador de $TAM\" nesta imagem"; falhou=1; continue; }
            UDID=$(xcrun simctl create "Em Dia $TAM" "$TIPO" "$RUNTIME")
            echo "[capturas] $TAM\" → $TIPO ($UDID)"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl privacy "$UDID" grant notifications "$BUNDLE_ID" || true
            CAPTURAS_DIR="artefactos/capturas/$TAM" perl -e 'alarm 1500; exec @ARGV' \
              flutter drive --driver=test_driver/capturas_driver.dart \
                --target=integration_test/capturas_loja_test.dart \
                -d "$UDID" --dart-define-from-file=.dart_defines 2>&1 | tee "artefactos/capturas/log-$TAM.txt"
            [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::capturas $TAM\" falharam (ver log-$TAM.txt)"; falhou=1; }
            # Prova do tamanho: a App Store recusa píxeis diferentes dos da tabela dela.
            for f in artefactos/capturas/$TAM/*.png; do
              [ -f "$f" ] || continue
              echo "$f $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')"
            done
            xcrun simctl shutdown "$UDID" || true
          done
          test "$falhou" -eq 0

      - name: Publicar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-capturas-${{ github.run_number }}
          path: artefactos/
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: B · IPA assinado → App Store Connect
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.enviar &&
      needs.simulador.result == 'success'
    needs: simulador
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Fixar Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Conferir que os segredos de assinatura existem
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          DEFINES: ${{ secrets.DART_DEFINES_FILE_B64 }}
        run: |
          faltam=""
          [ -z "$CERT" ]          && faltam="$faltam IOS_DIST_CERT_P12_B64"
          [ -z "$PROFILE" ]       && faltam="$faltam IOS_PROVISIONING_PROFILE_B64"
          [ -z "$ASC_KEY" ]       && faltam="$faltam ASC_KEY_P8_B64"
          [ -z "$ASC_KEY_ID" ]    && faltam="$faltam ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && faltam="$faltam ASC_ISSUER_ID"
          [ -z "$ASC_TEAM_ID" ]   && faltam="$faltam ASC_TEAM_ID"
          [ -z "$DEFINES" ]       && faltam="$faltam DART_DEFINES_FILE_B64"
          if [ -n "$faltam" ]; then
            echo "::error::Faltam segredos:$faltam — ver docs/SECRETS-IOS.md."
            exit 1
          fi

      - name: Instalar certificado e perfil
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/emdia.keychain-db
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          echo "$CERT_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PERFIL=~/Library/MobileDevice/Provisioning\ Profiles/emdia.mobileprovision
          echo "$PROFILE_B64" | base64 --decode > "$PERFIL"

          # O nome do perfil lê-se de DENTRO dele (não se crava no repo), e
          # confere-se que é mesmo do bundle do Em Dia — um perfil do Bora aqui
          # dava um IPA que a Apple recusa só no fim do upload.
          security cms -D -i "$PERFIL" > $RUNNER_TEMP/perfil.plist
          NOME=$(plutil -extract Name raw $RUNNER_TEMP/perfil.plist)
          APPID=$(plutil -extract Entitlements.application-identifier raw $RUNNER_TEMP/perfil.plist)
          echo "perfil: «$NOME» → $APPID"
          case "$APPID" in
            *".${BUNDLE_ID}") ;;
            *) echo "::error::o perfil é de $APPID, não de $BUNDLE_ID"; exit 1 ;;
          esac
          echo "PERFIL_NOME=$NOME" >> $GITHUB_ENV

      - name: Segredos de build + assinatura manual
        env:
          DART_DEFINES_FILE_B64: ${{ secrets.DART_DEFINES_FILE_B64 }}
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          echo "$DART_DEFINES_FILE_B64" | base64 --decode > .dart_defines
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "::warning::sem GoogleService-Info.plist — o IPA sai sem push (a app funciona na mesma)."
          fi
          # A conta do revisor da Apple entra por palavra-passe só se EMAIL_REVISOR vier preenchido.
          grep -q '^EMAIL_REVISOR=..' .dart_defines || echo "::warning::EMAIL_REVISOR vazio — o revisor só tem o modo exemplo."
          awk -F= '/^(TURNSTILE_SITE_KEY|SUPABASE_URL|GOOGLE_WEB_CLIENT_ID|EMAIL_REVISOR)=/ { print $1 "=" $2 }' .dart_defines > ios/Flutter/Secrets.xcconfig
          # Assinatura manual para o arquivo de Release, sem Team ID no repo:
          # Release.xcconfig inclui o Secrets.xcconfig e vale por cima do projeto.
          {
            echo "CODE_SIGN_STYLE=Manual"
            echo "DEVELOPMENT_TEAM=${ASC_TEAM_ID}"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER=${PERFIL_NOME}"
          } >> ios/Flutter/Secrets.xcconfig

      - name: Dependências
        run: flutter pub get

      # O ExportOptions.plist NÃO está no repo: leva o Team ID e o nome do perfil.
      - name: Gerar ExportOptions.plist
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${ASC_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PERFIL_NOME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          plutil -lint ios/ExportOptions.plist

      - name: Construir o IPA
        run: |
          flutter build ipa --release \
            --dart-define-from-file=.dart_defines \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Enviar para o App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_B64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # Upload → versão com releaseType AFTER_APPROVAL → build ligada → notas →
      # submetida. Cicatriz do Bora (22/09): versão criada com lançamento MANUAL
      # ficou aprovada um dia inteiro sem ir para a loja. O script lê tudo de
      # volta e rebenta o job se a Apple não ficar como se pediu.
      - name: Versão com lançamento automático + submeter
        if: inputs.submeter_revisao
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          SUBMETER_REVISAO: "1"
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyjwt cryptography requests
          export ASC_P8=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          python3 .github/scripts/ios_publicar.py

      - name: Publicar o IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
