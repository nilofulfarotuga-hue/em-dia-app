<script>
// Um link só para tudo (bio, stories, comentários, QR). iPhone/iPad → App Store; resto → app web.
// Mantém a origem (?de=...) para se saber de onde veio a instalação.
(function () {
  var q = new URLSearchParams(location.search);
  var de = q.get('de') || 'baixar';
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var loja = 'https://apps.apple.com/pt/app/em-dia-recibos-e-impostos/id6814807320';
  var web = 'https://app.emdia.boraguarda.com/?de=' + encodeURIComponent(de);
  location.replace(ios ? loja : web);
})();
</script>
