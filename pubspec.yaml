name: em_dia
description: "Em Dia — o assistente do trabalhador independente a recibos verdes e do carro, para Portugal."
publish_to: 'none'

# O número depois do "+" (versionCode) é incrementado SÓ pelo CI (build_android.yml).
# NUNCA mexer à mão — regra herdada do Bora.
version: 1.0.0+22

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # Estado (padrão do Bora: Model → Store → Screen)
  provider: ^6.1.2

  # Backend
  supabase_flutter: ^2.9.0
  http: ^1.2.2

  # Login: e-mail com código (Supabase) + Google
  google_sign_in: ^7.1.0

  # Avisos (push)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0

  # Fotos dos comprovativos — Photo Picker do Android (não o seletor antigo)
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13 # para ligar o Photo Picker (ImagePickerAndroid.useAndroidPhotoPicker)
  image_picker_platform_interface: ^2.11.0 # ImagePickerPlatform.instance (o getter do image_picker é só para testes)

  # Assinaturas (Google Play Billing)
  in_app_purchase: ^3.2.0

  # Guias com "ouvir"
  flutter_tts: ^4.2.0

  # Exportar para o contabilista (PDF/CSV)
  pdf: ^3.11.0
  printing: ^5.13.0
  csv: ^6.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4

  # Utilidades
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  timezone: ^0.10.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icone.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icone_adaptativo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/icone.png"
    background_color: "#F0FDF4"
    theme_color: "#16A34A"
