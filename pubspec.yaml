name: em_dia
description: "Em Dia — o assistente do trabalhador independente a recibos verdes e do carro, para Portugal."
publish_to: 'none'

# O número depois do "+" (versionCode) é incrementado SÓ pelo CI (build_android.yml).
# NUNCA mexer à mão — regra herdada do Bora.
version: 1.0.0+41

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # Estado (padrão do Bora: Model → Store → Screen)
  provider: ^6.1.2

  # Backend
  supabase_flutter: ^2.9.0
  http: ^1.2.2
  # Anti-robô no pedido de código de entrada (Cloudflare Turnstile). Só
  # trabalha quando a build traz TURNSTILE_SITE_KEY — ver lib/services/arranque.dart.
  cloudflare_turnstile: ^3.8.1

  # Login: e-mail com código (Supabase) + Google
  google_sign_in: ^7.1.0

  # Avisos (push)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0

  # Fotos dos comprovativos — Photo Picker do Android (não o seletor antigo)
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13 # para ligar o Photo Picker (ImagePickerAndroid.useAndroidPhotoPicker)
  image_picker_platform_interface: ^2.11.0 # ImagePickerPlatform.instance (o getter do image_picker é só para testes)

  # Assinaturas (Google Play Billing)
  in_app_purchase: ^3.2.0

  # Guias com "ouvir"
  flutter_tts: ^4.2.0
  # Ouvir a pessoa a falar (a outra metade do "fala comigo"). Usa o
  # reconhecimento de voz do próprio telemóvel — nada sai daqui para gravar.
  speech_to_text: ^7.0.0

  # Exportar para o contabilista (PDF/CSV)
  pdf: ^3.11.0
  printing: ^5.13.0
  csv: ^6.0.0
  # Importar o extrato do banco (CSV/Excel que todos os bancos exportam): escolher o
  # ficheiro (web + Android) e ler o .xlsx em Dart puro — nada sai do aparelho.
  file_selector: ^1.1.0
  excel: ^4.0.6
  share_plus: ^10.0.0
  path_provider: ^2.1.4

  # Utilidades
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  web: ^1.1.1 # download de CSV no painel admin (lib/admin/util/descarregar_web.dart)
  # «Perto de mim» (postos mais baratos e centros de inspeção): localização SÓ em
  # primeiro plano e só quando a pessoa carrega no botão — nunca em segundo plano
  # (foi o que a Google rejeitou ao Bora). Sem permissão, escreve-se o concelho.
  geolocator: ^14.0.2
  package_info_plus: ^8.0.0
  timezone: ^0.10.0
  fl_chart: ^0.69.0

# O cloudflare_turnstile traz o flutter_inappwebview. A versão estável (6.1.5 →
# flutter_inappwebview_android 1.1.3) ainda usa
# getDefaultProguardFile('proguard-android.txt') no build.gradle, que o AGP 9
# (o deste projecto, android/settings.gradle.kts) recusa — issue #2765 do
# pacote. A 6.2.0-beta.3 corrige ("Fixed [Android] Upgrade to AGP 9"). Tirar
# isto quando sair uma 6.2.0 estável.
dependency_overrides:
  flutter_inappwebview: 6.2.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test: # B8: integration_test/todos_os_ecras_test.dart (VM e AVD emdia)
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf

# Ícone da marca (B6, 2026-09-18): proposta 1 do tool/marca/desenhar.py (calendário
# com visto verde, 26 pts no juiz — docs/marca/pontuacoes.json). Gerar com
# `python tool/marca/desenhar.py icones --n 1` e depois `dart run flutter_launcher_icons`.
# A web NÃO passa por aqui: web/manifest.json e web/icons/* são escritos à mão e
# pelo desenhar.py (o gerador apagava o nome, a língua e a descrição do manifest).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false
