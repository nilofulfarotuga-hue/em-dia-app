<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Mudança de morada (2026-09-07): a app vive em app.emdia.boraguarda.com e o
       painel em admin.emdia.boraguarda.com (subdomínios de boraguarda.com; sem
       domínio próprio). Os *.pages.dev continuam a ser os projetos da Cloudflare
       Pages, mas quem lá chegar é levado para o endereço novo, com o caminho, a
       pesquisa e o #fragmento intactos. Corre antes de tudo o resto para não
       carregar o Flutter à toa; a porta dos robôs (em baixo) fica como estava. -->
  <script>
    (function () {
      var h = location.hostname;
      var novo = h === 'app-em-dia.pages.dev' ? 'https://app.emdia.boraguarda.com'
        : h === 'em-dia-admin.pages.dev' ? 'https://admin.emdia.boraguarda.com'
        : '';
      if (!novo) return;
      window.__emDiaMudouDeMorada = true;
      location.replace(novo + location.pathname + location.search + location.hash);
    })();
  </script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Em Dia — o assistente de quem trabalha por conta própria em Portugal: Segurança Social, IVA, IRS e o carro.">
  <!-- PWA (B6, 2026-09-18): cor da marca na barra do browser/instalada; o
       manifest.json tem o nome, a língua e os ícones; o sw.js (registado no
       flutter_bootstrap.js depois do primeiro ecrã) guarda a app para abrir
       sem rede. -->
  <meta name="theme-color" content="#16A34A">
  <meta name="color-scheme" content="light">
  <!-- A app nao e para ser indexada nem rastreada: a 6 de setembro de 2026 o
       Googlebot rastreou esta pagina, submeteu o formulario de entrada com
       enderecos inventados e tentou codigos. Ver web/robots.txt e web/_headers. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Em Dia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Em Dia</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Porta para robôs (2026-09-06, noite). O robots.txt e o noindex pedem; isto
    manda. A 6 de setembro, com o Turnstile já ligado, um renderizador da
    Google (74.125.209.x) abriu a app, escreveu um e-mail inventado e pediu
    código — a Cloudflare dá token a um Chrome a sério, seja de quem for. Um
    rastreador que se apresente como tal não chega a carregar a app: fica com
    uma frase e um link para o site. Uma pessoa num Chrome normal nunca cai
    aqui. Quem não se apresenta (headless disfarçado) leva com o Turnstile.
  -->
  <script>
    (function () {
      // Já vai a caminho da morada nova (script no <head>): não carregar nada.
      if (window.__emDiaMudouDeMorada) return;
      var ua = navigator.userAgent || '';
      var robo = /bot|crawl|spider|slurp|Google-InspectionTool|Google-Read-Aloud|Storebot|AdsBot|Mediapartners|FeedFetcher|HeadlessChrome|Lighthouse|PTST|Bytespider|facebookexternalhit|Applebot/i.test(ua)
        || (navigator.webdriver === true);
      if (robo) {
        document.addEventListener('DOMContentLoaded', function () {
          document.body.innerHTML = '<main style="font-family:Inter,system-ui,sans-serif;max-width:32rem;margin:4rem auto;padding:0 1.5rem;color:#0F172A"><h1 style="color:#16A34A">Em Dia</h1><p>Esta é a aplicação, só para pessoas. Para saber o que é o Em Dia, vê o site: <a href="https://emdia.boraguarda.com/">emdia.boraguarda.com</a>.</p></main>';
        });
        return;
      }
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>
  <!--
    Vigia do tamanho da janela (2026-09-18, missão em-dia-tudo). A 17 de
    setembro a app "encolheu para metade do ecrã" ao mudar o tamanho da janela
    e só endireitou com F5. Reproduzido: o motor do Flutter (3.47, CanvasKit)
    só ouve o evento `resize` do `visualViewport`; quando esse evento não chega
    (janela escondida, emulação, alguns redimensionamentos do Windows) a
    <flutter-view> fica com o tamanho antigo e o desenho não volta até um
    clique. Um `visualViewport.dispatchEvent(new Event('resize'))` à mão faz o
    motor acordar na hora — provado no navegador embutido do Claude.
    Isto vigia a diferença entre a <flutter-view> e a janela (ResizeObserver
    na raiz + uma olhadela de 700 em 700 ms) e, quando há diferença, dá esse
    empurrão. Sem diferença, não faz nada.
  -->
  <script>
    (function () {
      if (window.__emDiaMudouDeMorada) return;
      var ultimo = 0;
      var corrigiu = 0;
      function medir() {
        var v = document.querySelector('flutter-view');
        if (!v) return;
        var r = v.getBoundingClientRect();
        var w = window.innerWidth, h = window.innerHeight;
        if (w > 0 && h > 0 && (Math.abs(r.width - w) > 1 || Math.abs(r.height - h) > 1)) {
          corrigiu++;
          (window.visualViewport || window).dispatchEvent(new Event('resize'));
          window.__emDiaVigiaTamanho = { corrigiu: corrigiu, quando: Date.now() };
        }
      }
      function agendar() { clearTimeout(ultimo); ultimo = setTimeout(medir, 120); }
      if (window.ResizeObserver) {
        new ResizeObserver(agendar).observe(document.documentElement);
      }
      window.addEventListener('resize', agendar);
      window.addEventListener('orientationchange', agendar);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') agendar();
      });
      setInterval(medir, 700);
    })();
  </script>
</body>
</html>
